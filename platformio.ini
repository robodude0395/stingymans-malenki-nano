; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Upload:
;   TX (Pro Mini, needs a USB-serial adapter on FTDI header): pio run -e tx -t upload
;   RX (Pro Micro, native USB):                               pio run -e rx -t upload
;      (if the port is not found, double-tap RST to enter the Caterina bootloader)
;
; Pairing: both boards derive their RF address + hop sequence from TX_ID in
; include/radio_config.h. Change it there and flash BOTH boards. To override
; from here instead, add the SAME line to [env:tx] AND [env:rx]:
;   build_flags = -D TX_ID=0x12345678UL
;
; Library versions are pinned exactly (plain @x.y.z = that exact version).

[platformio]
default_envs = tx, rx

; Pro Mini 5V/16MHz (ATmega328P) - the transmitter hardware
[env:tx]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
build_src_filter = +<tx/>
lib_deps =
    nRF24/RF24@1.4.11
    olikraus/U8g2@2.35.30
monitor_speed = 57600

; Alternative: Pro Mini 3.3V/8MHz. Uncomment if your TX board is the 8MHz variant.
;[env:tx_8mhz]
;extends = env:tx
;board = pro8MHzatmega328

; Old Nano robot receiver, replaced by [env:rx] (Pro Micro). Kept for reference.
;[env:robot]
;platform = atmelavr
;board = nanoatmega328
;framework = arduino
;build_src_filter = +<robot/>
;lib_deps =
;    nRF24/RF24@^1.4.7
;    olikraus/U8g2@^2.35.7

; Pro Micro 5V/16MHz (ATmega32U4) - the receiver on the robot
[env:rx]
platform = atmelavr
; Clone Pro Micro with the Leonardo bootloader: build as a Leonardo so the
; board keeps the same USB identity (2341:8036) in bootloader and sketch mode.
; Same ATmega32U4 @16MHz and same pin numbers (D7-D10, D14-D16) as sparkfun_promicro16.
board = leonardo
framework = arduino
build_src_filter = +<rx/>
lib_deps =
    nRF24/RF24@1.4.11
monitor_speed = 115200
; Pro Micro (native USB) always shows up as /dev/ttyACM*. Without this,
; auto-detect can pick the laptop's built-in /dev/ttyS0 and fail.
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*

; Alternative: Pro Micro 3.3V/8MHz. The Timer1 PWM code adapts via F_CPU.
;[env:rx_8mhz]
;extends = env:rx
;board = sparkfun_promicro8

; Host unit tests for the shared protocol (include/link_protocol.h): pio test -e native
[env:native]
platform = native@1.2.1
test_framework = unity
build_src_filter = -<*>
